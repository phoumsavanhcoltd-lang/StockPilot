<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StockPilot Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <div><h1>StockPilot Settings</h1><p>Local AI configuration</p></div>
      <span id="state" class="badge">NOT CONFIGURED</span>
    </header>
    <section class="card">
      <label for="provider">AI Provider</label>
      <select id="provider"><option value="gemini">Google Gemini</option></select>
      <label for="apiKey">Gemini API Key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="Paste your API key">
      <small>Stored locally in this browser and sent only to your local StockPilot backend when analyzing.</small>
      <label for="model">Model</label>
      <input id="model" value="gemini-2.5-flash">
      <label for="backend">Local Backend</label>
      <input id="backend" value="http://127.0.0.1:8787">
      <div class="row">
        <button id="save">Save Settings</button>
        <button id="test" class="secondary">Test Connection</button>
      </div>
      <div id="message" class="status">Settings are local to this browser.</div>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
